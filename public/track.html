<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"><meta name="theme-color" content="#1d3526"><title>Your order</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Inter:wght@400;500;600;700;800&display=swap">
<style>
:root{--brand:#244633;--ink:#1c1b17;--muted:#6f6c63;--paper:#f6f3ec;--card:#fff;--line:#ece7dc;--good:#16855a;--hot:#ff6a3d;--head:"Bricolage Grotesque",Inter,system-ui,sans-serif}
[hidden]{display:none!important}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:480px;margin:0 auto;padding-bottom:28px}

/* The restaurant, compact */
.hero{position:relative;color:#fff;padding:calc(14px + env(safe-area-inset-top)) 18px 46px;background:var(--brand);overflow:hidden}
.hero-img{position:absolute;inset:0;background-size:cover;background-position:center;opacity:.3}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,color-mix(in srgb,var(--brand) 92%,#000),color-mix(in srgb,var(--brand) 55%,transparent))}
.hero>*{position:relative;z-index:1}
.hero-top{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:12px;font-weight:700;opacity:.9}
.live{display:inline-flex;align-items:center;gap:6px}
.live i{width:7px;height:7px;border-radius:50%;background:#5ef0a6;animation:ping 2s infinite}
.live.off i{background:#ccc;animation:none}
.rrow{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-top:14px}
.rname{font-family:var(--head);font-weight:800;font-size:30px;line-height:1;letter-spacing:-1px}
.rmeta{font-size:13px;opacity:.8;margin-top:5px}
.table-tag{flex:none;background:#fff;color:var(--brand);font-weight:800;font-size:13px;border-radius:10px;padding:7px 11px}

/* Status */
.status{position:relative;z-index:2;margin:-30px 12px 12px;background:var(--card);border-radius:22px;padding:18px 18px 16px;box-shadow:0 14px 40px rgba(30,25,10,.12)}
.test{display:inline-block;background:#fff4d6;color:#7a5410;border-radius:20px;padding:3px 10px;font-size:11.5px;font-weight:700;margin-bottom:10px}
.st-head{display:flex;align-items:center;gap:12px}
.emoji{flex:none;width:48px;height:48px;border-radius:14px;display:grid;place-items:center;font-size:26px;background:color-mix(in srgb,var(--brand) 10%,#fff)}
.s-new .emoji{animation:bob 2.4s ease-in-out infinite}.s-cook .emoji{animation:sizzle 1.3s ease-in-out infinite}.s-done .emoji{animation:pop .5s cubic-bezier(.2,1.6,.4,1) both;background:#e5f4ec}
.st-text{flex:1;min-width:0}
h1{font-family:var(--head);font-size:21px;line-height:1.15;letter-spacing:-.5px;margin:0}
.lead{color:var(--muted);font-size:14px;line-height:1.4;margin:3px 0 0;min-height:20px;transition:opacity .35s}
.lead.fade{opacity:0}
.eta{flex:none;text-align:right}
.eta b{display:block;font-family:var(--head);font-size:22px;letter-spacing:-.6px;color:var(--brand);line-height:1;font-variant-numeric:tabular-nums}
.eta small{font-size:11.5px;color:var(--muted);font-weight:600}

/* Horizontal progress */
.bar{position:relative;height:8px;border-radius:8px;background:#efebe2;margin:18px 0 8px;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;width:0;border-radius:8px;background:linear-gradient(90deg,var(--good),color-mix(in srgb,var(--good) 70%,var(--brand)));transition:width .9s ease}
.bar i::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,rgba(255,255,255,.28) 0 10px,transparent 10px 20px);background-size:40px 100%;animation:slide 1s linear infinite}
.s-done .bar i::after{display:none}
.steps{display:grid;grid-template-columns:repeat(3,1fr);font-size:12px;font-weight:700;color:#aaa597}
.steps span:nth-child(2){text-align:center}.steps span:nth-child(3){text-align:right}
.steps span.done{color:var(--good)}.steps span.now{color:var(--ink)}
.steps small{display:block;font-weight:600;color:var(--muted);font-size:11px;margin-top:1px}

.again{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:14px;min-height:46px;border-radius:14px;background:var(--brand);color:#fff;text-decoration:none;font-weight:800;font-size:15px}
.again.soft{background:color-mix(in srgb,var(--brand) 9%,#fff);color:var(--brand)}

.card{margin:0 12px 12px;background:var(--card);border-radius:20px;padding:14px 18px;box-shadow:0 6px 18px rgba(30,25,10,.05)}
.card h2{display:flex;justify-content:space-between;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 4px}
.card h2 span{letter-spacing:0;text-transform:none;font-weight:600}
.items{margin:0;padding:0;list-style:none}
.items li{display:flex;justify-content:space-between;gap:12px;padding:8px 0;font-size:14.5px;border-bottom:1px dashed var(--line)}
.items li span:first-child b{display:inline-grid;place-items:center;min-width:22px;height:22px;border-radius:6px;background:#f3f0e8;font-size:12px;margin-right:8px}
.items li.total{border-bottom:0;font-weight:800}
.tip{font-size:13px;color:var(--muted);line-height:1.45;margin:0 16px;text-align:center}
.foot{text-align:center;color:#a19c8f;font-size:11.5px;margin-top:16px}
.foot b{color:#5d594f;font-weight:800}.foot b em{color:var(--hot);font-style:normal}
.cancelled .emoji{background:#fde8e5}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:5}
.confetti i{position:absolute;top:-12px;width:8px;height:12px;border-radius:2px;animation:fall 2.6s linear forwards}

@keyframes ping{0%{box-shadow:0 0 0 0 rgba(94,240,166,.55)}70%{box-shadow:0 0 0 7px rgba(94,240,166,0)}100%{box-shadow:0 0 0 0 rgba(94,240,166,0)}}
@keyframes bob{50%{transform:translateY(-4px) rotate(-5deg)}}
@keyframes sizzle{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg) translateY(-2px)}}
@keyframes pop{from{transform:scale(.3)}to{transform:scale(1)}}
@keyframes slide{to{background-position:40px 0}}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<div class="wrap">
  <header class="hero"><div class="hero-img" id="hero-img"></div>
    <div class="hero-top"><span class="live" id="live"><i></i><span>Live</span></span><span id="order-no"></span></div>
    <div class="rrow"><div><div class="rname" id="rname">&nbsp;</div><div class="rmeta" id="rmeta"></div></div><span class="table-tag" id="table" hidden></span></div>
  </header>

  <section class="status s-new" id="status" aria-live="polite">
    <span class="test" id="test" hidden>🧪 Demo order · test payment</span>
    <div class="st-head"><span class="emoji" id="emoji">👨‍🍳</span>
      <div class="st-text"><h1 id="headline">Finding your order…</h1><p class="lead" id="lead"></p></div>
      <div class="eta" id="eta" hidden><b id="count"></b><small id="count-label"></small></div></div>
    <div id="progress" hidden><div class="bar"><i id="fill"></i></div><div class="steps" id="steps"></div></div>
    <a class="again" id="again" hidden href="#">＋ Order something else</a>
  </section>

  <section class="card"><h2>Your order <span id="paid-at"></span></h2><ul class="items" id="items"></ul></section>
  <p class="tip" id="tip">Need anything? Wave to a member of staff, they can see your order too.</p>
  <p class="foot">Updates by itself, no refresh needed · Ordered with <b>punchbook<em>.</em></b></p>
</div>
<script>
(()=>{
  const $=id=>document.getElementById(id),id=decodeURIComponent(location.pathname.split('/').pop()||'');
  const money=n=>{const v=Math.round(Number(n||0)*100)/100;return'LKR '+v.toLocaleString('en-LK',{minimumFractionDigits:v%1?2:0,maximumFractionDigits:2})};
  const hm=iso=>iso?new Date(iso).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'}):'';
  const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  let o=null,skew=0,lastKey='',fails=0,branded=false,lineIx=0,lineTimer=null;

  const kind=o=>o.fulfilment==='delivery'?'delivery':o.orderType==='pickup'?'pickup':'table';
  const stageOf=o=>o.orderStatus==='new'?0:o.orderStatus==='preparing'?1:2;
  // Headline, emoji and a few lines that rotate while the guest waits.
  const COPY={
    0:['Order accepted ✅','👨‍🍳',['The kitchen’s firing up the pans for you.','Your food is up next. Great picks, by the way.','Chef’s getting the ingredients ready.']],
    1:['We’re cookin’ 🔥','🍳',['Pans are hot, spices are flying.','Plating it up with a little extra love.','Smells good from here. Hang tight.','Perfect moment to put the phone down and chat 😉']],
    table:['Dig in!','🍽️',['Food’s on the table. Enjoy every bite.','Hope it tastes as good as it looks.']],
    pickup:['Hot and ready!','🛍️',['Swing by the counter and give your name.']],
    delivery:['Out the door!','🛵',['Your rider is on the way with your food.']],
  };
  const LAST={table:'Served',pickup:'Ready',delivery:'On the way'};
  function brand(o){
    if(branded)return;branded=true;const b=o.brand||{};
    document.documentElement.style.setProperty('--brand',b.accent||'#244633');
    document.querySelector('meta[name=theme-color]').content=b.accent||'#244633';
    if(b.cover)$('hero-img').style.backgroundImage=`url("${b.cover.replace(/"/g,'%22')}")`;
    $('rname').textContent=b.name||o.restaurantName;$('rmeta').textContent=b.area||'';
    $('order-no').textContent='Order '+o.id.replace(/^PB-/,'#');
    if(o.menuUrl)$('again').href=o.menuUrl;
  }
  function rotate(lines){
    clearInterval(lineTimer);lineIx=0;$('lead').textContent=lines[0];
    if(lines.length>1)lineTimer=setInterval(()=>{$('lead').classList.add('fade');setTimeout(()=>{lineIx=(lineIx+1)%lines.length;$('lead').textContent=lines[lineIx];$('lead').classList.remove('fade')},350)},6000);
  }
  function confetti(){
    const box=document.createElement('div'),c=['#16855a','#ff6a3d','#ffc93c',getComputedStyle(document.documentElement).getPropertyValue('--brand')];
    box.className='confetti';box.innerHTML=Array.from({length:50},(_,i)=>`<i style="left:${Math.random()*100}%;background:${c[i%4]};animation-delay:${Math.random()*.8}s"></i>`).join('');
    document.body.append(box);setTimeout(()=>box.remove(),3800);
  }
  let shownKey='';
  function render(){
    if(!o)return;brand(o);
    const k=kind(o),at=stageOf(o),paid=o.paymentStatus==='paid',cancelled=o.orderStatus==='cancelled',st=$('status');
    $('test').hidden=!o.sandbox;
    $('table').hidden=k!=='table'||!o.table;$('table').textContent='Table '+o.table;
    $('paid-at').textContent=o.paidAt?'paid '+hm(o.paidAt):'';
    $('items').innerHTML=o.items.map(i=>`<li><span><b>${esc(i.qty)}</b>${esc(i.name)}</span><span>${money(i.price*i.qty)}</span></li>`).join('')+`<li class="total"><span>Total</span><span>${money(o.total)}</span></li>`;
    const key=cancelled?'x':!paid?'p':String(at)+k;
    if(cancelled){st.className='status cancelled';$('emoji').textContent='🙏';$('headline').textContent='Order cancelled';
      rotate([o.refunded?'Your payment is on its way back to your card. Staff can help with any questions.':'You weren’t charged.']);$('eta').hidden=true;$('progress').hidden=true;$('again').hidden=!o.menuUrl;$('again').className='again soft';return}
    if(!paid){st.className='status s-new';$('emoji').textContent='💳';$('headline').textContent='Waiting for payment';if(key!==shownKey)rotate(['Your order goes to the kitchen once the payment is through.']);shownKey=key;$('eta').hidden=true;$('progress').hidden=true;$('again').hidden=true;return}
    const [h,emoji,lines]=at<2?COPY[at]:COPY[k];
    st.className='status '+(at===0?'s-new':at===1?'s-cook':'s-done');
    $('emoji').textContent=emoji;$('headline').textContent=h;
    if(key!==shownKey)rotate(lines);shownKey=key;
    const t=o.times||{},times=[o.paidAt,t.preparing,t.served||t.ready||t.collected];
    $('progress').hidden=false;
    $('steps').innerHTML=['Accepted','Cookin’',LAST[k]].map((l,i)=>{const s=i<at||at===2?'done':i===at?'now':'';return`<span class="${s}">${s==='done'?'✓ ':''}${l}<small>${s&&times[i]?hm(times[i]):s==='now'?'now':''}</small></span>`}).join('');
    // "Order something else" stays quiet while waiting, and becomes the main button once the food arrives.
    $('again').hidden=!o.menuUrl;$('again').className='again'+(at===2?'':' soft');$('again').textContent=at===2?'＋ Hungry for more? Order again':'＋ Add something to your order';
    tick();
  }
  // The bar creeps forward with the estimated time; the chip counts down.
  function tick(){
    if(!o||o.paymentStatus!=='paid'||o.orderStatus==='cancelled')return;
    const at=stageOf(o);
    if(at===2){$('eta').hidden=true;$('fill').style.width='100%';return}
    const now=Date.now()+skew,start=Date.parse(o.paidAt||o.createdAt),end=Date.parse(o.times?.preparing||o.paidAt||o.createdAt)+(o.prepMinutes+(at===0?2:0))*60000;
    const frac=Math.max(0,Math.min(1,(now-start)/Math.max(1,end-start)));
    $('fill').style.width=(at===0?6+frac*28:34+frac*56).toFixed(1)+'%';
    const left=end-now;$('eta').hidden=false;
    if(left>60000){$('count').textContent='~'+Math.round(left/60000)+' min';$('count-label').textContent='by '+hm(new Date(end).toISOString())}
    else{$('count').textContent='Soon';$('count-label').textContent='any minute'}
  }
  async function load(){
    try{
      const r=await fetch('/api/track/'+encodeURIComponent(id),{cache:'no-store'});
      if(r.status===404){$('headline').textContent='Order not found';$('lead').textContent='Check the link, or ask a member of staff.';return}
      const x=await r.json();skew=Date.parse(x.now)-Date.now();
      const key=x.paymentStatus+'|'+x.orderStatus;
      if(lastKey&&key!==lastKey){try{navigator.vibrate?.([120,80,120])}catch{}if(['served','ready','collected'].includes(x.orderStatus))confetti()}
      lastKey=key;o=x;fails=0;$('live').classList.remove('off');$('live').querySelector('span').textContent='Live';
      document.title=({new:'Order accepted',preparing:'We’re cookin’',served:'Dig in!',ready:'Ready!',collected:'Collected',cancelled:'Cancelled'}[o.orderStatus]||'Your order')+' · '+((o.brand&&o.brand.name)||o.restaurantName);
      render();
    }catch{if(++fails>2){$('live').classList.add('off');$('live').querySelector('span').textContent='Reconnecting…'}}
  }
  if(!id){$('headline').textContent='No order';return}
  try{localStorage.setItem('pb-last-order',JSON.stringify({id,at:Date.now()}))}catch{}
  load();setInterval(()=>{if(!document.hidden)load()},5000);setInterval(tick,1000);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)load()});
})();
</script>
</body></html>
