<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"><meta name="theme-color" content="#1d3526"><title>Your order</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&display=swap">
<style>
:root{--brand:#244633;--ink:#1c1b17;--muted:#6f6c63;--paper:#f6f3ec;--card:#fff;--line:#ebe6db;--good:#16855a;--hot:#ff6a3d}
[hidden]{display:none!important}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:480px;margin:0 auto;padding:0 0 32px}

/* The restaurant, front and centre */
.hero{position:relative;color:#fff;padding:calc(18px + env(safe-area-inset-top)) 20px 92px;background:var(--brand);overflow:hidden;border-radius:0 0 30px 30px}
.hero-img{position:absolute;inset:0;background-size:cover;background-position:center;opacity:.35;transform:scale(1.08);filter:saturate(1.1)}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.25),color-mix(in srgb,var(--brand) 80%,#000) 92%)}
.hero>*{position:relative;z-index:1}
.hero-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.chip{display:inline-flex;align-items:center;gap:7px;background:rgba(255,255,255,.16);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.22);border-radius:30px;padding:7px 12px;font-size:12.5px;font-weight:700;white-space:nowrap}
.chip i{width:7px;height:7px;border-radius:50%;background:#5ef0a6;box-shadow:0 0 0 0 rgba(94,240,166,.6);animation:ping 2s infinite}
.chip.off i{background:#ccc;animation:none}
.rname{font-family:Fraunces,Georgia,serif;font-weight:700;font-size:clamp(34px,10vw,44px);line-height:1.02;letter-spacing:-1px;margin:26px 0 6px}
.rmeta{font-size:14px;opacity:.85;font-weight:500}
.table-tag{display:inline-block;margin-top:14px;background:#fff;color:var(--brand);font-weight:800;font-size:14px;border-radius:12px;padding:8px 14px;box-shadow:0 6px 18px rgba(0,0,0,.18)}

/* Status card overlapping the hero */
.status{position:relative;z-index:2;margin:-70px 14px 14px;background:var(--card);border-radius:26px;padding:26px 20px 22px;box-shadow:0 18px 50px rgba(30,25,10,.14);text-align:center}
.test{display:inline-block;background:#fff4d6;color:#7a5410;border:1px solid #f0d98c;border-radius:20px;padding:4px 12px;font-size:12px;font-weight:700;margin-bottom:14px}
.dial{--p:0;position:relative;width:176px;height:176px;margin:0 auto 18px;border-radius:50%;display:grid;place-items:center;
  background:conic-gradient(var(--brand) calc(var(--p)*1%),#efebe2 0);transition:--p .6s}
.dial::before{content:"";position:absolute;inset:10px;border-radius:50%;background:var(--card)}
.dial .emoji{position:relative;font-size:64px;line-height:1}
.dial.s-new .emoji{animation:bob 2.4s ease-in-out infinite}
.dial.s-cook .emoji{animation:sizzle 1.4s ease-in-out infinite}
.dial.s-done{background:conic-gradient(var(--good) 100%,#efebe2 0)}
.dial.s-done .emoji{animation:pop .6s cubic-bezier(.2,1.6,.4,1) both}
.steam{position:absolute;top:30px;left:50%;width:60px;margin-left:-30px;height:40px;pointer-events:none}
.steam span{position:absolute;bottom:0;width:8px;height:22px;border-radius:8px;background:linear-gradient(transparent,rgba(160,150,130,.45));animation:steam 2.2s ease-out infinite;opacity:0}
.steam span:nth-child(1){left:10px}.steam span:nth-child(2){left:26px;animation-delay:.7s}.steam span:nth-child(3){left:42px;animation-delay:1.4s}
.dial:not(.s-cook) .steam{display:none}
h1{font-size:25px;line-height:1.2;letter-spacing:-.6px;margin:0 0 6px}
.lead{color:var(--muted);font-size:15px;line-height:1.5;margin:0 auto;max-width:330px}
.eta{display:flex;justify-content:center;align-items:baseline;gap:8px;margin-top:16px}
.eta b{font-size:34px;letter-spacing:-1.2px;font-variant-numeric:tabular-nums;color:var(--brand)}
.eta small{color:var(--muted);font-size:13px;font-weight:600}

/* Three steps, always shown, current one lit */
.track{display:grid;grid-template-columns:repeat(3,1fr);margin-top:24px;position:relative}
.track::before,.track .fill{content:"";position:absolute;top:19px;left:16.6%;height:4px;border-radius:4px}
.track::before{right:16.6%;background:#efebe2}
.track .fill{background:var(--good);width:0;transition:width .8s ease}
.tstep{position:relative;display:flex;flex-direction:column;align-items:center;gap:8px;padding:0 4px}
.tdot{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-size:18px;background:#f3f0e8;color:#b5b0a3;border:3px solid var(--card);box-shadow:0 0 0 2px #efebe2;transition:all .4s}
.tstep.done .tdot{background:var(--good);color:#fff;box-shadow:0 0 0 2px var(--good)}
.tstep.now .tdot{background:var(--brand);color:#fff;box-shadow:0 0 0 2px var(--brand),0 0 0 8px color-mix(in srgb,var(--brand) 18%,transparent);animation:glow 1.8s ease-in-out infinite}
.tlabel{font-size:12.5px;font-weight:700;color:#aaa597;line-height:1.25}
.tstep.done .tlabel,.tstep.now .tlabel{color:var(--ink)}
.ttime{font-size:11.5px;color:var(--muted);font-weight:600;min-height:14px}
.tstep.now .ttime{color:var(--brand)}

.card{margin:0 14px 14px;background:var(--card);border-radius:22px;padding:18px 20px;box-shadow:0 6px 20px rgba(30,25,10,.05)}
.card h2{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}
.items{margin:0;padding:0;list-style:none}
.items li{display:flex;justify-content:space-between;gap:12px;padding:9px 0;font-size:15px;border-bottom:1px dashed var(--line)}
.items li span:first-child b{display:inline-grid;place-items:center;min-width:24px;height:24px;border-radius:7px;background:#f3f0e8;font-size:12.5px;margin-right:8px}
.items li.total{border-bottom:0;font-weight:800;padding-top:12px;font-size:16px}
.help{display:flex;gap:12px;align-items:center;font-size:14px;color:var(--muted);line-height:1.45}
.help span:first-child{font-size:26px}
.foot{text-align:center;color:#9d988b;font-size:12px;margin-top:20px;line-height:1.7}
.foot b{color:#5d594f;font-weight:800;letter-spacing:-.3px}.foot b em{color:var(--hot);font-style:normal}
.cancelled .dial{background:conic-gradient(#d4493b 100%,#efebe2 0)}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:5}
.confetti i{position:absolute;top:-12px;width:9px;height:14px;border-radius:2px;animation:fall 2.6s linear forwards}

@keyframes ping{0%{box-shadow:0 0 0 0 rgba(94,240,166,.55)}70%{box-shadow:0 0 0 8px rgba(94,240,166,0)}100%{box-shadow:0 0 0 0 rgba(94,240,166,0)}}
@keyframes bob{50%{transform:translateY(-6px) rotate(-4deg)}}
@keyframes sizzle{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg) translateY(-3px)}}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes steam{0%{transform:translateY(0) scaleX(1);opacity:0}25%{opacity:1}100%{transform:translateY(-34px) scaleX(1.8);opacity:0}}
@keyframes glow{50%{box-shadow:0 0 0 2px var(--brand),0 0 0 13px color-mix(in srgb,var(--brand) 8%,transparent)}}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<div class="wrap">
  <header class="hero" id="hero"><div class="hero-img" id="hero-img"></div>
    <div class="hero-top"><span class="chip" id="live"><i></i><span>Live</span></span><span class="chip" id="order-no">Order</span></div>
    <div class="rname" id="rname">&nbsp;</div><div class="rmeta" id="rmeta"></div><div class="table-tag" id="table" hidden></div>
  </header>

  <section class="status" id="status" aria-live="polite">
    <span class="test" id="test" hidden>🧪 Demo order · test payment</span>
    <div class="dial s-new" id="dial"><div class="steam"><span></span><span></span><span></span></div><span class="emoji" id="emoji">🧾</span></div>
    <h1 id="headline">Loading your order…</h1>
    <p class="lead" id="lead"></p>
    <div class="eta" id="eta" hidden><b id="count">--:--</b><small id="count-label"></small></div>
    <div class="track" id="track" hidden><div class="fill" id="fill"></div></div>
  </section>

  <section class="card"><h2>Your order</h2><ul class="items" id="items"></ul></section>
  <section class="card help"><span>🙋</span><span id="help">Need anything? Just wave to a member of staff, they can see your order too.</span></section>
  <p class="foot">This page updates by itself, no need to refresh.<br>Ordered with <b>punchbook<em>.</em></b></p>
</div>
<script>
(()=>{
  const $=id=>document.getElementById(id),id=decodeURIComponent(location.pathname.split('/').pop()||'');
  const money=n=>{const v=Math.round(Number(n||0)*100)/100;return'LKR '+v.toLocaleString('en-LK',{minimumFractionDigits:v%1?2:0,maximumFractionDigits:2})};
  const hm=iso=>iso?new Date(iso).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'}):'';
  const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  let o=null,skew=0,lastKey='',fails=0,branded=false;

  // Stage: 0 received, 1 being prepared, 2 served / ready / on its way. done = the order is finished.
  const stageOf=o=>({at:o.orderStatus==='new'?0:o.orderStatus==='preparing'?1:2,done:['served','collected'].includes(o.orderStatus)});
  const kind=o=>o.fulfilment==='delivery'?'delivery':o.orderType==='pickup'?'pickup':'table';
  const LAST={table:['Served','🍽️'],pickup:['Ready','🛍️'],delivery:['On its way','🛵']};
  const COPY={
    0:['Order received','The kitchen has your order and will start on it shortly. Sit back and relax.','🧾'],
    1:['Your food is being prepared','The kitchen is cooking your order right now.','🍳'],
    table:['Enjoy your meal!','Your food is at your table. Thank you for dining with us.','🍽️'],
    pickup:['Ready to collect!','Head to the counter and give your name.','🛍️'],
    delivery:['On its way!','Your rider is bringing your order to you.','🛵'],
  };
  function brand(o){
    if(branded)return;branded=true;const b=o.brand||{};
    document.documentElement.style.setProperty('--brand',b.accent||'#244633');
    document.querySelector('meta[name=theme-color]').content=b.accent||'#244633';
    if(b.cover)$('hero-img').style.backgroundImage=`url("${b.cover.replace(/"/g,'%22')}")`;
    $('rname').textContent=b.name||o.restaurantName;$('rmeta').textContent=b.area||b.cuisine||'';
    $('order-no').textContent='Order '+o.id.replace(/^PB-/,'#');
  }
  function confetti(){
    const box=document.createElement('div');box.className='confetti';const colors=['#16855a','#ff6a3d','#ffc93c',getComputedStyle(document.documentElement).getPropertyValue('--brand')];
    box.innerHTML=Array.from({length:60},(_,i)=>`<i style="left:${Math.random()*100}%;background:${colors[i%colors.length]};animation-delay:${Math.random()*.8}s;transform:rotate(${Math.random()*180}deg)"></i>`).join('');
    document.body.append(box);setTimeout(()=>box.remove(),3800);
  }
  function render(){
    if(!o)return;brand(o);
    const k=kind(o),{at,done}=stageOf(o),paid=o.paymentStatus==='paid',cancelled=o.orderStatus==='cancelled';
    $('test').hidden=!o.sandbox;
    $('table').hidden=k!=='table'||!o.table;$('table').textContent='Table '+o.table;
    $('items').innerHTML=o.items.map(i=>`<li><span><b>${esc(i.qty)}</b>${esc(i.name)}</span><span>${money(i.price*i.qty)}</span></li>`).join('')+`<li class="total"><span>Total paid</span><span>${money(o.total)}</span></li>`;
    $('status').classList.toggle('cancelled',cancelled);
    const dial=$('dial');
    if(cancelled){dial.className='dial';$('emoji').textContent='🙏';$('headline').textContent='Order cancelled';
      $('lead').textContent=o.refunded?'Your payment is being refunded to your card in full. A member of staff can help if you have questions.':'You weren’t charged.';
      $('eta').hidden=true;$('track').hidden=true;return}
    if(!paid){dial.className='dial s-new';$('emoji').textContent='💳';$('headline').textContent='Waiting for payment';$('lead').textContent='Your order goes to the kitchen as soon as the payment is confirmed.';$('eta').hidden=true;$('track').hidden=true;return}
    const [h,lead,emoji]=at<2?COPY[at]:COPY[k];
    dial.className='dial '+(at===0?'s-new':at===1?'s-cook':'s-done');
    $('emoji').textContent=emoji;$('headline').textContent=h;$('lead').textContent=lead;
    // The three steps
    const t=o.times||{},steps=[['Received','✓',o.paidAt],['Preparing','🍳',t.preparing],[LAST[k][0],LAST[k][1],t.served||t.ready||t.collected]];
    $('track').hidden=false;
    $('track').innerHTML='<div class="fill" id="fill"></div>'+steps.map(([label,icon,when],i)=>{const st=i<at||(i===at&&done)||(i===2&&at===2)?'done':i===at?'now':'next';
      return`<div class="tstep ${st}"><span class="tdot">${st==='done'?'✓':st==='now'?icon:i+1}</span><span class="tlabel">${label}</span><span class="ttime">${st==='next'?'':st==='now'&&!when?'now':hm(when)}</span></div>`}).join('');
    requestAnimationFrame(()=>{$('fill').style.width=(at===0?0:at===1?33.4:66.8)+'%'});
    tick();
  }
  // The dial fills up and the countdown runs to the estimated time.
  function tick(){
    if(!o||o.paymentStatus!=='paid'||o.orderStatus==='cancelled')return;
    const {at}=stageOf(o);
    if(at===2){$('eta').hidden=true;$('dial').style.setProperty('--p',100);return}
    const now=Date.now()+skew,start=Date.parse(o.paidAt||o.createdAt),end=Date.parse(o.times?.preparing||o.paidAt||o.createdAt)+(o.prepMinutes+(at===0?2:0))*60000,left=end-now;
    $('dial').style.setProperty('--p',Math.max(3,Math.min(97,(now-start)/Math.max(1,end-start)*100)).toFixed(1));
    $('eta').hidden=false;
    if(left>0){const m=Math.floor(left/60000),s=Math.floor(left%60000/1000);$('count').textContent=m>=1?`~${m+(s>29?1:0)} min`:`${s}s`;$('count-label').textContent=`${kind(o)==='table'?'at your table':'ready'} by ${hm(new Date(end).toISOString())}`}
    else{$('count').textContent='Any minute';$('count-label').textContent='almost there, thanks for waiting'}
  }
  async function load(){
    try{
      const r=await fetch('/api/track/'+encodeURIComponent(id),{cache:'no-store'});
      if(r.status===404){$('headline').textContent='Order not found';$('lead').textContent='Check the link, or ask a member of staff.';return}
      const x=await r.json();skew=Date.parse(x.now)-Date.now();
      const key=x.paymentStatus+'|'+x.orderStatus;
      if(lastKey&&key!==lastKey){try{navigator.vibrate?.([120,80,120])}catch{}if(['served','ready','collected'].includes(x.orderStatus))confetti()}
      lastKey=key;o=x;fails=0;$('live').classList.remove('off');$('live').querySelector('span').textContent='Live';
      document.title=({new:'Order received',preparing:'Being prepared',served:'Served!',ready:'Ready!',collected:'Collected',cancelled:'Cancelled'}[o.orderStatus]||'Your order')+' · '+((o.brand&&o.brand.name)||o.restaurantName);
      render();
    }catch{if(++fails>2){$('live').classList.add('off');$('live').querySelector('span').textContent='Reconnecting…'}}
  }
  if(!id){$('headline').textContent='No order';return}
  try{localStorage.setItem('pb-last-order',JSON.stringify({id,at:Date.now()}))}catch{}
  load();setInterval(()=>{if(!document.hidden)load()},5000);setInterval(tick,1000);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)load()});
})();
</script>
</body></html>
