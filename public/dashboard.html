<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080c17"><script>try{document.documentElement.dataset.theme=localStorage.getItem("pb-theme")||(matchMedia("(prefers-color-scheme: light)").matches?"light":"dark")}catch(e){}</script><title>Restaurant dashboard · Punchbook</title>
<meta name="description" content="Sign in to your Punchbook restaurant dashboard: live orders, payments and earnings.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
<link rel="stylesheet" href="/hq.css?v=1a703b5e33ff">
<style>
.login-page{min-height:100vh;display:grid;place-items:center;padding:24px 16px}
.login{width:100%;max-width:400px}
.login .brand{display:flex;justify-content:center;margin-bottom:22px}
.login-card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:28px;display:grid;gap:14px;position:relative;overflow:hidden}
.login-card::before{content:"";position:absolute;inset:0 0 auto;height:2px;background:linear-gradient(90deg,var(--green),var(--cyan),transparent)}
.login-card h1{margin:0;font-size:24px;color:var(--strong)}
.login-card p{margin:0;color:var(--muted);font-size:13.5px;line-height:1.5}
.login-card label{display:grid;gap:6px;font-size:12.5px;font-weight:650;color:var(--muted)}
.login-card input{min-height:48px;border-radius:12px;border:1px solid var(--line2);background:var(--bg2);color:var(--text);padding:0 14px;font:inherit;font-size:16px}
.login-card input:focus{outline:2px solid var(--green);outline-offset:1px}
.login-card .btn{min-height:48px;font-size:15px;margin-top:4px}
.login-card .err{color:var(--rose);font-size:13px;font-weight:600}
.login-foot{display:flex;justify-content:space-between;gap:12px;margin-top:16px;font-size:12.5px;color:var(--muted)}
.login-foot a{color:var(--muted)}
.login-what{display:flex;gap:8px;flex-wrap:wrap}
</style></head><body>
<div class="login-page"><div class="login">
  <a class="brand" href="/"><span class="logo">p</span><span>punchbook<em>.</em></span></a>
  <form class="login-card" id="form" novalidate>
    <div><h1>Restaurant dashboard</h1><p>Live orders, payments and what you’re paid each day.</p></div>
    <label>Username<input id="username" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required></label>
    <label>Password<input id="password" name="password" type="password" autocomplete="current-password" required></label>
    <p class="err" id="err" role="alert" hidden></p>
    <button class="btn primary" id="go">Sign in</button>
    <div class="login-what"><span class="pill info">Live orders</span><span class="pill good">Payments</span><span class="pill warn">Earnings · T+2</span></div>
  </form>
  <div class="login-foot"><a href="/">← punchbook.online</a><span>Forgot your login? <a href="https://wa.me/94771757487">WhatsApp us</a></span></div>
</div></div>
<script>
(()=>{
  const KEY='pb-staff-key',$=id=>document.getElementById(id);
  const q=new URLSearchParams(location.search),raw=q.get('next')||'';
  // Only go back to a page on this site.
  const next=/^\/(?!\/)[\w\-./?=&#%]*$/.test(raw)?raw:'';
  const where=role=>next||(role==='admin'?'/hq':'/restaurant');
  const read=()=>{try{return localStorage.getItem(KEY)||''}catch{return''}};
  const err=m=>{$('err').textContent=m;$('err').hidden=!m};
  if(q.has('expired'))err('Please sign in again.');
  // Already signed in: go straight in.
  if(read())fetch('/api/staff/me',{headers:{'x-staff-key':read()}}).then(r=>r.ok?r.json():null).then(me=>{if(me&&!me.open)location.replace(where(me.role))}).catch(()=>{});
  $('username').focus();
  $('form').addEventListener('submit',async e=>{
    e.preventDefault();err('');
    const username=$('username').value.trim(),password=$('password').value;
    if(!username||!password)return err('Enter your username and password.');
    $('go').disabled=true;$('go').textContent='Signing in…';
    try{
      const r=await fetch('/api/staff/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username,password})});
      const out=await r.json().catch(()=>({}));
      if(!r.ok)throw Error(out.error||'Couldn’t sign in. Please try again.');
      try{localStorage.setItem(KEY,out.token||'')}catch{}
      location.replace(where(out.role));
    }catch(x){err(x.message);$('go').disabled=false;$('go').textContent='Sign in';$('password').select()}
  });
})();
</script>
<script src="/theme.js?v=15ec769fae04"></script>
</body></html>
