<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Punchbook · Restaurant</title><link rel="stylesheet" href="/styles.css"><style>.adminGrid{display:grid;grid-template-columns:260px 1fr;min-height:100vh}.side{background:#171713;color:white;padding:25px}.side .brand{margin-bottom:40px}.side a{display:block;color:#aaa;padding:11px 0;font-weight:700}.side a.active{color:white}.main{padding:30px}.head{display:flex;justify-content:space-between;align-items:end;margin-bottom:22px}.head h1{font-size:36px;letter-spacing:-1.5px;margin:0}.orders{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.order{background:white;border:1px solid var(--line);border-radius:20px;padding:16px}.orderTop{display:flex;justify-content:space-between}.badge{padding:6px 9px;border-radius:99px;background:#eef7f1;color:#157d55;font-size:11px;font-weight:900;text-transform:uppercase}.order h3{font-size:20px;margin:12px 0 2px}.line{display:flex;justify-content:space-between;font-size:13px;padding:5px 0;color:#666}.actions{display:flex;gap:7px;margin-top:13px}.actions button{flex:1;border:1px solid var(--line);background:white;border-radius:10px;padding:9px;font-weight:800}.actions button.primary2{background:#171713;color:white}@media(max-width:850px){.adminGrid{grid-template-columns:1fr}.side{display:none}.main{padding:16px}.orders{grid-template-columns:1fr}.head h1{font-size:29px}}</style></head><body><div class="adminGrid"><aside class="side"><div class="brand">punchbook<span style="color:#ff5c35">.</span></div><a class="active">Orders</a><a>Menu</a><a>Tables & QR</a><a>Payments</a><a>Settings</a></aside><main class="main"><div class="head"><div><div class="eyebrow">Peppermint Café</div><h1>Live orders</h1></div><a class="pill" href="/qr?table=12" target="_blank">Table 12 QR ↗</a></div><div id="orders" class="orders"></div></main></div><script>
const money=n=>'LKR '+Number(n).toLocaleString('en-LK');async function load(){const orders=await fetch('/api/orders').then(r=>r.json());document.getElementById('orders').innerHTML=orders.length?orders.map(o=>`<article class="order"><div class="orderTop"><b>${o.id}</b><span class="badge">${o.paymentStatus}</span></div><h3>Table ${o.table}</h3><div style="color:#888;font-size:12px;margin-bottom:10px">${new Date(o.createdAt).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})} · ${o.paymentMethod}</div>${o.items.map(i=>`<div class="line"><span>${i.qty} × ${i.name}</span><span>${money(i.price*i.qty)}</span></div>`).join('')}<div class="line" style="border-top:1px solid #eee;margin-top:8px;padding-top:10px;color:#171713;font-weight:900"><span>Total</span><span>${money(o.total)}</span></div><div class="actions"><button onclick="status('${o.id}','preparing')">Preparing</button><button class="primary2" onclick="status('${o.id}','served')">Served</button></div><div style="font-size:11px;color:#999;margin-top:8px">Status: ${o.orderStatus}</div></article>`).join(''):'<div style="color:#777">No orders yet. Place one from the customer menu.</div>';}
async function status(id,s){await fetch('/api/orders/'+id+'/status',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({orderStatus:s})});load()}load();setInterval(load,2500);
</script></body></html>
