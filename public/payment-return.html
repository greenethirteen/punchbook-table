<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Payment · Punchbook</title><link rel="stylesheet" href="/styles.css"></head><body><main class="wrap" style="max-width:560px;padding-top:70px"><div class="item" style="display:block;text-align:center;padding:30px"><div class="check" style="margin:auto">…</div><h1>Checking payment</h1><p id="msg" style="color:#777">Verifying the payment with the gateway.</p><a class="pill" href="/r/peppermint/t/12" style="display:inline-block;margin-top:12px;text-decoration:none">Back to menu</a></div></main><script>const id=new URLSearchParams(location.search).get('order');fetch('/api/payments/verify',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({orderId:id})}).then(r=>r.json()).then(x=>{document.querySelector('.check').textContent=x.ok?'✓':'!';document.getElementById('msg').textContent=x.ok?'Payment confirmed. Your order is with the restaurant.':'Payment is not confirmed yet.'}).catch(()=>document.getElementById('msg').textContent='Could not verify payment.');</script></body></html>
