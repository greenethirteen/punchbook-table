<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Payment · Punchbook</title><link rel="stylesheet" href="/styles.css?v=73ed25b24a03"></head><body><main class="wrap" style="max-width:560px;padding-top:70px"><div class="item" style="display:block;text-align:center;padding:30px"><div class="check" style="margin:auto">…</div><h1 id="title">Checking payment</h1><p id="msg" style="color:#777">Confirming your payment with the bank.</p><a id="back" class="pill" href="/" style="display:inline-block;margin-top:12px;text-decoration:none" hidden>Back</a></div></main>
<script>
// Customers land here from the Payments.lk checkout. The server confirms the payment with Payments.lk;
// this page asks a few times because the bank can take a moment.
const q=new URLSearchParams(location.search),id=q.get('order'),cancelled=q.has('cancelled');
const $=s=>document.querySelector(s);
function show(icon,title,msg,order){
  $('.check').textContent=icon;$('#title').textContent=title;$('#msg').textContent=msg;
  const back=$('#back');back.hidden=false;
  if(!order||order.orderType==='pickup'){
    // The app is Android-only. Chrome opens it through an intent link, or the Play listing if it isn't installed;
    // anywhere else a punchbook:// link just errors, so there is nothing to tap.
    if(/Android/i.test(navigator.userAgent)){back.href='intent://order/'+encodeURIComponent(id)+'#Intent;scheme=punchbook;package=order.punchbook.com;S.browser_fallback_url='+encodeURIComponent('https://play.google.com/store/apps/details?id=order.punchbook.com')+';end';back.textContent='Back to the Punchbook app';}
    else{back.hidden=true;if(icon==='✓')$('#msg').textContent+=' Your order updates are in the Punchbook app.';}
  }
  else{back.href=(order.payment?.provider==='onepay'?'/peppermint-v5/t/':order.payment?.provider==='payhere'?'/peppermint-v6/t/':order.restaurantId==='amra'?'/amraleaf-v3/t/':'/peppermint/t/')+encodeURIComponent(order.table||'');back.textContent='Back to the menu';}
}
async function check(tries){
  try{
    const x=await fetch('/api/payments/verify',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({orderId:id})}).then(r=>r.json());
    if(x.ok)return show('✓','Payment confirmed','Your order is with the restaurant. You can close this page.',x.order);
    if(tries>0&&!cancelled&&!x.error)return setTimeout(()=>check(tries-1),2500);
    show('!',cancelled?'Payment cancelled':'Payment not confirmed',cancelled?'You weren’t charged. Go back to try again.':(x.error||'We couldn’t confirm the payment yet. If you were charged, it will show on your order within a few minutes.'),x.order);
  }catch{show('!','Couldn’t check the payment','Check your connection, then open your order in the app.')}
}
if(id)check(cancelled?0:6);else show('!','No order','This link is missing its order number.');
</script></body></html>
