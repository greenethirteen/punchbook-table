<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Sign up · Punchbook</title>
  <meta name="description" content="Sign up your restaurant for Punchbook.">
  <link rel="stylesheet" href="/onboarding.css?v=2">
</head>
<body>
<header class="topbar"><a class="brand" href="/">punchbook<span>.</span></a><a class="back" href="/">← Back</a></header>
<main class="shell">
  <section class="hero"><h1>Join <em>Punchbook.</em></h1></section>

  <form id="company-form" class="form-card">
    <input type="hidden" name="businessCategory" value="Restaurant">
    <input type="hidden" name="contactRole" value="Owner / authorised contact">

    <section class="form-section">
      <div class="section-copy"><h2>Business</h2></div>
      <div class="grid two">
        <label>Company name<input name="companyName" required autocomplete="organization"></label>
        <label>BR number<input name="registrationNumber" required></label>
        <label>Restaurant name<input name="tradingName" required></label>
        <label>Business type<select name="businessType" required><option value="">Select</option><option>Private Limited Company</option><option>Sole Proprietorship</option><option>Partnership</option><option>Other</option></select></label>
        <label class="wide">Registered address<textarea name="registeredAddress" required rows="2"></textarea></label>
      </div>
    </section>

    <section class="form-section">
      <div class="section-copy"><h2>Contact</h2></div>
      <div class="grid two">
        <label>Full name<input name="contactName" required autocomplete="name"></label>
        <label>NIC / passport number<input name="nicNumber" required></label>
        <label>Email<input name="email" type="email" required autocomplete="email"></label>
        <label>Phone<input name="phone" type="tel" required autocomplete="tel"></label>
      </div>
    </section>

    <section class="form-section">
      <div class="section-copy"><h2>Bank</h2></div>
      <div class="grid two">
        <label>Bank<input name="bankName" required></label>
        <label>Branch<input name="bankBranch" required></label>
        <label>Account name<input name="bankAccountName" required></label>
        <label>Account number<input name="bankAccountNumber" required inputmode="numeric"></label>
      </div>
    </section>

    <section class="form-section">
      <div class="section-copy"><h2>Documents</h2></div>
      <div class="uploads">
        <label class="upload"><span>Business registration</span><input name="businessRegistration" type="file" accept="application/pdf,image/jpeg,image/png" required></label>
        <label class="upload"><span>NIC / passport</span><input name="identityDocument" type="file" accept="application/pdf,image/jpeg,image/png" required></label>
        <label class="upload"><span>Bank proof</span><input name="bankProof" type="file" accept="application/pdf,image/jpeg,image/png" required></label>
      </div>
    </section>

    <section class="form-section compact">
      <label class="check"><input name="declaration" type="checkbox" required><span>I confirm these details are correct and may be used for onboarding.</span></label>
    </section>

    <div class="submit-row"><button id="submit-btn" type="submit">Submit →</button></div>
    <p id="form-status" class="status" role="status" aria-live="polite"></p>
  </form>

  <section id="success" class="success" hidden><span>✓</span><h2>Submitted.</h2><p>Reference: <strong id="reference"></strong></p><a href="/">Back to Punchbook →</a></section>
</main>
<script src="/onboarding.js?v=2"></script>
</body>
</html>
