<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Applications · Punchbook</title>
  <link rel="stylesheet" href="/onboarding.css?v=1">
</head>
<body>
<header class="topbar"><a class="brand" href="/">punchbook<span>.</span></a><a href="/admin">Orders dashboard ↗</a></header>
<main class="admin-wrap">
  <div class="admin-head">
    <div><p class="eyebrow">PUNCHBOOK ADMIN</p><h1>Applications</h1><p>Review restaurants that have applied to join Punchbook.</p></div>
  </div>
  <div class="filters">
    <input id="search" type="search" placeholder="Search company, contact or BR number">
    <select id="status-filter"><option value="">All statuses</option><option>submitted</option><option>under-review</option><option>ipg-submitted</option><option>approved</option><option>live</option><option>rejected</option></select>
  </div>
  <p id="message" class="status"></p>
  <section id="company-list" class="company-list"><div class="empty">Loading applications…</div></section>
</main>
<div id="drawer" class="drawer" hidden>
  <section class="drawer-panel">
    <div class="drawer-top"><div><p class="eyebrow">APPLICATION</p><h2 id="detail-title">Company</h2><p id="detail-ref"></p></div><button id="close" class="close">✕</button></div>
    <div id="details" class="detail-grid"></div>
    <h3>Documents</h3><div id="docs" class="docs"></div>
    <div class="status-editor"><h3>Review status</h3><select id="edit-status"><option>submitted</option><option>under-review</option><option>ipg-submitted</option><option>approved</option><option>live</option><option>rejected</option></select><textarea id="admin-notes" rows="4" placeholder="Internal notes"></textarea><button id="save-status">Save review</button><p id="save-message" class="status"></p></div>
  </section>
</div>
<script>
const listEl=document.getElementById('company-list'),message=document.getElementById('message'),search=document.getElementById('search'),statusFilter=document.getElementById('status-filter'),drawer=document.getElementById('drawer'),detailTitle=document.getElementById('detail-title'),detailRef=document.getElementById('detail-ref'),details=document.getElementById('details'),docs=document.getElementById('docs'),editStatus=document.getElementById('edit-status'),notes=document.getElementById('admin-notes'),saveStatus=document.getElementById('save-status'),saveMessage=document.getElementById('save-message');let companies=[],active=null;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const fmt=n=>Number(n||0).toLocaleString('en-LK');
async function load(){message.textContent='Loading…';const r=await fetch('/api/public/companies');const d=await r.json().catch(()=>({}));if(!r.ok){message.textContent=d.error||'Could not load applications.';return}companies=d.companies||[];message.textContent='';render()}
function render(){const q=search.value.trim().toLowerCase(),st=statusFilter.value,rows=companies.filter(c=>{const hay=[c.companyName,c.tradingName,c.registrationNumber,c.contactName,c.email].join(' ').toLowerCase();return(!q||hay.includes(q))&&(!st||c.status===st)});if(!rows.length){listEl.innerHTML='<div class="empty">No matching company applications.</div>';return}listEl.innerHTML=rows.map(c=>`<article class="company-row" data-id="${esc(c.id)}"><div><strong>${esc(c.tradingName||c.companyName)}</strong><small>${esc(c.companyName)} · ${esc(c.registrationNumber)}</small></div><div>${esc(c.contactName)}<small>${esc(c.email)}</small></div><div><span class="badge ${esc(c.status)}">${esc(c.status)}</span><small>${new Date(c.createdAt).toLocaleDateString()}</small></div><button type="button">Review →</button></article>`).join('');document.querySelectorAll('.company-row').forEach(e=>e.addEventListener('click',()=>openCompany(e.dataset.id)))}
async function openCompany(id){saveMessage.textContent='';const r=await fetch(`/api/public/companies/${encodeURIComponent(id)}`),d=await r.json().catch(()=>({}));if(!r.ok){message.textContent=d.error||'Could not load application.';return}active=d.company;detailTitle.textContent=active.tradingName||active.companyName;detailRef.textContent=`${active.reference} · Submitted ${new Date(active.createdAt).toLocaleString()}`;const fields=[['Registered company',active.companyName],['BR number',active.registrationNumber],['Business type',active.businessType],['Category',active.businessCategory],['Registered address',active.registeredAddress],['Website',active.website||'—'],['Contact',active.contactName],['Role',active.contactRole],['Email',active.email],['Phone',active.phone],['NIC / passport',active.nicNumber],['Bank',active.bankName],['Branch',active.bankBranch],['Account name',active.bankAccountName],['Account number',active.bankAccountNumber]];details.innerHTML=fields.map(([a,b])=>`<div class="detail"><span>${esc(a)}</span><strong>${esc(b)}</strong></div>`).join('');docs.innerHTML=Object.entries(active.documents||{}).map(([name,d])=>`<a target="_blank" rel="noopener" href="/api/public/companies/${encodeURIComponent(active.id)}/document/${encodeURIComponent(name)}"><span>${esc(d.name||name)}</span><span>Open ↗</span></a>`).join('')||'<p>No documents.</p>';editStatus.value=active.status||'submitted';notes.value=active.adminNotes||'';drawer.hidden=false}
async function save(){if(!active)return;saveStatus.disabled=true;saveMessage.textContent='Saving…';try{const r=await fetch(`/api/public/companies/${encodeURIComponent(active.id)}/status`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:editStatus.value,adminNotes:notes.value})}),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Could not save review.');saveMessage.textContent='Saved.';await load()}catch(e){saveMessage.textContent=e.message}finally{saveStatus.disabled=false}}
search.addEventListener('input',render);statusFilter.addEventListener('change',render);saveStatus.addEventListener('click',save);document.getElementById('close').addEventListener('click',()=>drawer.hidden=true);drawer.addEventListener('click',e=>{if(e.target===drawer)drawer.hidden=true});load();
</script>
</body>
</html>
