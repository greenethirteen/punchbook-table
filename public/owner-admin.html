<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Applications · Punchbook</title><link rel="stylesheet" href="/onboarding.css?v=1"></head><body><header class="topbar"><a class="brand" href="/">punchbook<span>.</span></a><a href="/admin">Orders dashboard ↗</a></header><main class="admin-wrap"><div class="admin-head"><div><p class="eyebrow">PUNCHBOOK ADMIN</p><h1>Applications</h1><p>Review restaurants that have applied to join Punchbook.</p></div></div><div class="filters"><input id="search" type="search" placeholder="Search company, contact or BR number"><select id="status-filter"><option value="">All statuses</option><option>submitted</option><option>under-review</option><option>ipg-submitted</option><option>approved</option><option>live</option><option>rejected</option></select></div><p id="message" class="status"></p><section id="company-list" class="company-list"><div class="empty">Loading applications…</div></section></main><div id="drawer" class="drawer" hidden><section class="drawer-panel"><div class="drawer-top"><div><p class="eyebrow">APPLICATION</p><h2 id="detail-title">Company</h2><p id="detail-ref"></p></div><button id="close" class="close">✕</button></div><div id="details" class="detail-grid"></div><div class="status-editor"><h3>Review status</h3><select id="edit-status"><option>submitted</option><option>under-review</option><option>ipg-submitted</option><option>approved</option><option>live</option><option>rejected</option></select><textarea id="admin-notes" rows="4" placeholder="Internal notes"></textarea><button id="save-status">Save review</button><p id="save-message" class="status"></p></div></section></div><script>
const L=document.getElementById('company-list'),M=document.getElementById('message'),Q=document.getElementById('search'),F=document.getElementById('status-filter'),D=document.getElementById('drawer'),T=document.getElementById('detail-title'),R=document.getElementById('detail-ref'),G=document.getElementById('details'),S=document.getElementById('edit-status'),N=document.getElementById('admin-notes'),B=document.getElementById('save-status'),SM=document.getElementById('save-message');let companies=[],active=null;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){M.textContent='Loading…';const r=await fetch('/api/public/companies'),d=await r.json().catch(()=>({}));if(!r.ok){M.textContent=d.error||'Could not load applications.';return}companies=d.companies||[];M.textContent='';render()}function render(){const q=Q.value.trim().toLowerCase(),st=F.value,rows=companies.filter(c=>{const h=[c.companyName,c.tradingName,c.registrationNumber,c.contactName].join(' ').toLowerCase();return(!q||h.includes(q))&&(!st||c.status===st)});if(!rows.length){L.innerHTML='<div class="empty">No matching company applications.</div>';return}L.innerHTML=rows.map(c=>`<article class="company-row" data-id="${esc(c.id)}"><div><strong>${esc(c.tradingName||c.companyName)}</strong><small>${esc(c.companyName)} · ${esc(c.registrationNumber)}</small></div><div>${esc(c.contactName)}</div><div><span class="badge ${esc(c.status)}">${esc(c.status)}</span><small>${new Date(c.createdAt).toLocaleDateString()}</small></div><button type="button">Review →</button></article>`).join('');document.querySelectorAll('.company-row').forEach(e=>e.addEventListener('click',()=>openCompany(e.dataset.id)))}async function openCompany(id){SM.textContent='';const r=await fetch(`/api/public/companies/${encodeURIComponent(id)}`),d=await r.json().catch(()=>({}));if(!r.ok){M.textContent=d.error||'Could not load application.';return}active=d.company;T.textContent=active.tradingName||active.companyName;R.textContent=`${active.reference} · Submitted ${new Date(active.createdAt).toLocaleString()}`;const fields=[['Registered company',active.companyName],['BR number',active.registrationNumber],['Business type',active.businessType],['Category',active.businessCategory],['Registered address',active.registeredAddress],['Contact',active.contactName],['Role',active.contactRole]];G.innerHTML=fields.map(([a,b])=>`<div class="detail"><span>${esc(a)}</span><strong>${esc(b)}</strong></div>`).join('');S.value=active.status||'submitted';N.value=active.adminNotes||'';D.hidden=false}async function save(){if(!active)return;B.disabled=true;SM.textContent='Saving…';try{const r=await fetch(`/api/public/companies/${encodeURIComponent(active.id)}/status`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:S.value,adminNotes:N.value})}),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Could not save review.');SM.textContent='Saved.';await load()}catch(e){SM.textContent=e.message}finally{B.disabled=false}}Q.addEventListener('input',render);F.addEventListener('change',render);B.addEventListener('click',save);document.getElementById('close').addEventListener('click',()=>D.hidden=true);D.addEventListener('click',e=>{if(e.target===D)D.hidden=true});load();</script></body></html>
