<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Test payment · Punchbook</title>
<style>
:root{--ink:#14201a;--muted:#667267;--line:#e3e6de;--green:#244633;--amber:#b7791f}
*{box-sizing:border-box}body{margin:0;background:#f3f5f1;color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh;display:grid;place-items:center;padding:20px 16px}
.wrap{width:100%;max-width:420px}
.test{background:#fff4d6;border:1px solid #f0d98c;color:#7a5410;border-radius:12px;padding:10px 14px;font-size:13px;font-weight:600;margin-bottom:14px;text-align:center}
.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:24px;box-shadow:0 18px 40px #1a2b2010}
.head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.merchant{display:flex;align-items:center;gap:10px;font-weight:700}
.logo{width:38px;height:38px;border-radius:10px;background:var(--green);color:#fff;display:grid;place-items:center;font-weight:800}
.secure{font-size:12px;color:#287a4b;background:#e6f4ea;border-radius:20px;padding:5px 10px;font-weight:600}
.amount{margin:22px 0 4px;color:var(--muted);font-size:13px}.amount b{display:block;color:var(--ink);font-size:30px;letter-spacing:-1px;margin-top:4px}
.ref{color:var(--muted);font-size:13px;padding-bottom:18px;border-bottom:1px solid var(--line)}
label{display:block;font-size:13px;font-weight:600;color:#3d4a40;margin:16px 0 6px}
.box{border:1px solid #d6dbd2;border-radius:12px;overflow:hidden}
.box input{border:0;border-radius:0}.box .row{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid #d6dbd2}.box .row input+input{border-left:1px solid #d6dbd2}
input{width:100%;min-height:50px;border:1px solid #d6dbd2;border-radius:12px;padding:0 14px;font:inherit;font-size:16px;color:var(--ink);background:#fff}
input:focus{outline:2px solid var(--green);outline-offset:-2px}
.acts{display:grid;grid-template-columns:1fr 2fr;gap:10px;margin-top:22px}
button{min-height:52px;border-radius:12px;font:inherit;font-size:16px;font-weight:700;cursor:pointer}
.back{background:#fff;border:1px solid #d6dbd2;color:var(--ink)}.pay{background:var(--ink);border:0;color:#fff}.pay:disabled{opacity:.6}
.foot{text-align:center;color:var(--muted);font-size:12px;margin-top:14px}
.err{color:#b42318;font-size:13px;margin-top:12px;font-weight:600}
</style></head><body>
<div class="wrap">
  <div class="test">🧪 Test payment: no real card is charged. This is Punchbook’s demo checkout.</div>
  <form class="card" id="form">
    <div class="head"><div class="merchant"><span class="logo">p</span><span id="merchant">Punchbook</span></div><span class="secure">🔒 Secure checkout</span></div>
    <div class="amount">Amount to pay<b id="amount">…</b></div>
    <div class="ref" id="ref">Loading order…</div>
    <label for="number">Card information</label>
    <div class="box"><input id="number" inputmode="numeric" autocomplete="off" value="4242 4242 4242 4242" aria-label="Card number">
      <div class="row"><input id="exp" value="12 / 30" aria-label="Expiry"><input id="cvv" value="123" inputmode="numeric" aria-label="Security code"></div></div>
    <label for="name">Name on card</label>
    <input id="name" value="Test Guest" autocomplete="off">
    <p class="err" id="err" role="alert" hidden></p>
    <div class="acts"><button type="button" class="back" id="cancel">Back</button><button class="pay" id="pay" disabled>Pay</button></div>
  </form>
  <p class="foot">Demo by punchbook. Real restaurants use a bank-approved card page here.</p>
</div>
<script>
(()=>{
  const $=id=>document.getElementById(id),id=new URLSearchParams(location.search).get('order');
  const money=n=>{const v=Math.round(Number(n||0)*100)/100;return'LKR '+v.toLocaleString('en-LK',{minimumFractionDigits:v%1?2:0,maximumFractionDigits:2})};
  const post=(path,body)=>fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}).then(async r=>{const x=await r.json().catch(()=>({}));if(!r.ok)throw Error(x.error||'Something went wrong.');return x});
  const done=extra=>location.replace('/payment-return.html?order='+encodeURIComponent(id)+(extra||''));
  const fail=m=>{$('err').textContent=m;$('err').hidden=false};
  let back='/';
  if(!id)return fail('This link is missing its order number.');
  post('/api/payments/sandbox/info',{orderId:id}).then(o=>{
    if(o.paid)return done();
    back=o.back;$('merchant').textContent=o.restaurantName;$('amount').textContent=money(o.total);
    $('ref').textContent=`Order ${o.id}${o.table?' · Table '+o.table:''}`;$('pay').textContent='Pay '+money(o.total);$('pay').disabled=o.cancelled;
    if(o.cancelled)fail('This order was cancelled.');
  }).catch(e=>fail(e.message));
  $('cancel').addEventListener('click',()=>location.href=back);
  $('form').addEventListener('submit',async e=>{
    e.preventDefault();$('pay').disabled=true;$('pay').textContent='Processing…';$('err').hidden=true;
    // A short pause so it feels like a real card check.
    await new Promise(r=>setTimeout(r,1200));
    try{await post('/api/payments/sandbox/pay',{orderId:id,last4:$('number').value});done()}
    catch(x){fail(x.message);$('pay').disabled=false;$('pay').textContent='Try again'}
  });
})();
</script>
</body></html>
